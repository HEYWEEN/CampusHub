name: CampusHub CI

# 1. 触发条件：当有代码 push 到 main/dev 分支，或者向它们发起 PR 时触发
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # 任务一：检查前端代码
  frontend-check:
    runs-on: ubuntu-latest # 在最新的 Linux 虚拟机上运行
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 第一步：拉取仓库代码

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 第二步：安装 Node 环境
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend # 在 frontend 目录下执行

      - name: Run build
        run: npm run build
        working-directory: ./frontend

  # 任务二：检查后端代码
  backend-check:
    runs-on: ubuntu-latest

    # 为后端测试启动一个 MySQL 8 service container
    # GitHub Actions 会等 health check 通过后再进入 steps
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campushub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4 # 第二步：安装 Java 17 环境
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make maven wrapper executable
        run: chmod +x mvnw
        working-directory: ./backend # 赋予 Linux 下 mvnw 的执行权限

      - name: Build and Test with Maven
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./mvnw clean install
        working-directory: ./backend # 编译并运行测试，确保后端代码质量