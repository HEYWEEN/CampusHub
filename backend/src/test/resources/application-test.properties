# 单测用 H2 内存库，跟本地 MySQL 解耦
spring.datasource.url=jdbc:h2:mem:campushub;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 单测用 H2 + JPA 自动建表，不跑 Flyway
spring.flyway.enabled=false

# JWT 测试密钥（生产覆盖）
campushub.jwt.secret=test-secret-for-unit-testing-only-do-not-use-in-prod-please-32bytes
campushub.jwt.access-ttl-minutes=60
campushub.jwt.refresh-ttl-days=7
