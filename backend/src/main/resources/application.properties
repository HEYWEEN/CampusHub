spring.application.name=campushub
spring.profiles.active=local

# DataSource — 实际密码写在 application-local.properties（不提交 git）
spring.datasource.url=jdbc:mysql://localhost:3306/campushub?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate（Hibernate 7 自动检测 dialect，无需手动指定）
# 表结构由 Flyway 管理，Hibernate 仅校验实体与库表一致
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 项目所有 boolean 字段在 DDL 中均为 TINYINT（非 BIT），让 Hibernate validate
# 时以 TINYINT 作为 boolean 的预期 JDBC 类型，否则会报
# Schema-validation: wrong column type found [tinyint], expecting [bit]
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT

# Flyway（增量脚本位于 db/migration/）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JWT
campushub.jwt.secret=${JWT_SECRET:dev-default-secret-please-override-in-prod-32bytes!!}
campushub.jwt.access-ttl-minutes=120
campushub.jwt.refresh-ttl-days=14
campushub.jwt.issuer=campushub

# 列加密密钥（auth_user.phone / 学生证 real_name & student_no 等）
campushub.crypto.aes-key=${AES_KEY:dev-default-aes-key-please-override-32b!!}

# 鉴权白名单（CSV，Ant 模式）
campushub.security.whitelist=/api/health,/api/auth/sms-codes,/api/auth/token,/api/auth/token/password,/api/auth/token/refresh,/api/auth/register,/api/users/*/public,/api/users/*/public/**,/error

# 图片上传（POST /api/uploads 仍需登录；GET /uploads/** 走静态资源，不被拦截）
campushub.upload.dir=./uploads
campushub.upload.url-prefix=/uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
