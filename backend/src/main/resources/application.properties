spring.application.name=campushub
spring.profiles.active=local

# DataSource — 实际密码写在 application-local.properties（不提交 git）
spring.datasource.url=jdbc:mysql://localhost:3306/campushub?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate（Hibernate 7 自动检测 dialect，无需手动指定）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
campushub.jwt.secret=${JWT_SECRET:dev-default-secret-please-override-in-prod-32bytes!!}
campushub.jwt.access-ttl-minutes=120
campushub.jwt.refresh-ttl-days=14
campushub.jwt.issuer=campushub

# 列加密密钥（auth_user.phone / 学生证 real_name & student_no 等）
campushub.crypto.aes-key=${AES_KEY:dev-default-aes-key-please-override-32b!!}

# 鉴权白名单（CSV，Ant 模式）
campushub.security.whitelist=/api/health,/api/auth/sms-codes,/api/auth/token,/api/auth/token/password,/api/auth/token/refresh,/api/auth/register,/error
