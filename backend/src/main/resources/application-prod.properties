# 生产环境 profile —— 仅引用环境变量，不写明文敏感值
# 通过 SPRING_PROFILES_ACTIVE=prod 激活（./start.sh prod 会自动设置）
# 真实值放在根目录 .env.prod（已 gitignore）

spring.application.name=campushub

# ----- DataSource -----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campushub}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ----- JPA / Hibernate -----
# 生产用 validate，禁止自动改表结构；schema 变更走 Flyway/Liquibase 或手动 SQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----- Server -----
server.port=${SERVER_PORT:8080}
